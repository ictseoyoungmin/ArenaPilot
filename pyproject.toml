[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arenapilot"
version = "0.1.0"
description = "Local-first agent runtime for reproducible machine-learning competition workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "kaggle>=2.2,<3",
  "mlflow>=3.15,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
arena = "arenapilot.cli_entry:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/arenapilot"]
